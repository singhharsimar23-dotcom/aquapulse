server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: verify-service
          uri: ${VERIFY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/readings/**
        - id: allocation-service
          uri: ${ALLOCATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/zones/**,/api/verify/**
        - id: guarantee-service
          uri: ${GUARANTEE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/guarantee/**
        - id: copilot-service
          uri: ${COPILOT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/copilot/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info
