apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aquapulse-api
  labels:
    cloud.googleapis.com/location: us-central1
    app: aquapulse
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "AquaPulse v8 Guaranteed Groundwater Ledger API"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0" # True scale-to-zero
        autoscaling.knative.dev/maxScale: "3" # Free-tier guardrail
        run.googleapis.com/cpu: "1000m"
        run.googleapis.com/memory: "512Mi"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/aquapulse-faang/aquapulse-unified:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
            - name: NEON_URL
              valueFrom:
                secretKeyRef:
                  name: neon-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-url
                  key: latest
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 2
